<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Building a page to take a quiz">
    <title>Bulid a quiz webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header> <img  id="logo"src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg" alt="freeCodeCamp"> 
    <h1>HTML/CSS Quiz</h1>
    <nav>
        <ul>
            <li><a href="#student-info">INFO</a></li>
            <li><a href="#html-questions">HTML</a></li>
            <li><a href="#css-questions">CSS</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <form action="https://freecodecamp.org/practice-project/accessibility-quiz " method="post">
            <section role="region" aria-labelledby="student-info"><h2 id="student-info">student-info</h2>
            <div class="info"><label for="student-name">name</label><input id="student-name" name="student-name" type="name"/></div>
            <div class="info"><label for="student-email">Email:</label><input id="student-email" name="email" type="email"/></div>
            <div class="info"><label for="birth-date">Date of Birth</label><input id="birth-date" name="birth-date" type="date"/></div>
            </section>
            <section role="region" aria-labelledby="html-questions"><h2 id="html-questions">HTML</h2>
            <div class="question-block"><h3><span class="sr-only">Question</span>1</h3><fieldset class="question">
              <legend></legend>
              <ul>
                <li></li>
                <li></li>
              </ul>
            </fieldset></div>
            <div class="question-block"><h3><span class="sr-only">Question</span>2</h3><fieldset class="question">
                <legend></legend>
              <ul>
                <li></li>
                <li></li>
              </ul>
            </fieldset></div>
            </section>
            <section role="region" aria-labelledby="css-questions"><h2 id="css-questions">CSS</h2></section>
             <button type="submit">Submit Data</button>
        </form>
    </main>
</body>
</html>
